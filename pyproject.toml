[project]
name = "esp32-countdown"
version = "0.1.0"
description = "An event countdown display running on an ESP32-C6 with a built-in LCD"
readme = "README.md"
authors = [
    { name = "terrycojones", email = "terry@fluidinfo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "esptool>=5.4.0",
    "mpremote>=1.29.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ also holds tests/test_micropython.py, which is NOT a pytest test --
# it runs on the MicroPython device (`make test-micropython`) and imports modules
# from device/lib/ that don't exist under plain CPython. Whitelisting the
# host-side files explicitly here keeps pytest from trying (and failing)
# to collect it.
python_files = [
    "test_upload_json.py",
    "test_upload_wifi.py",
    "test_port_config.py",
    "test_color_names.py",
]
pythonpath = ["."]
