# Example countdown config in TOML (the recommended authoring format --
# see README.md "Uploading your countdown data"). `upload_json.py` converts
# this to JSON automatically before uploading; the device itself only ever
# sees/stores JSON, since MicroPython has no TOML support.

[meta]
refetch_after_seconds = 3600
# meta.url is omitted here because TOML has no `null`. Omitting the
# key is how you represent "static mode" (with no configuration
# auto-update).
#
# url = "https://your-config-path.json"
# upload_command = "Your command to upload the JSON to your server."

[layout]
margin_top = 4
margin_bottom = 4
margin_left = 4
margin_right = 4
gap_before_value = 4
gap_value_after = 4

[defaults]
background = "#000000"
before_color = "#ffffff"
value_color = "#ffffff"
after_color = "#ffffff"

[[items]]
target = "2026-09-20T12:00:00Z"
display_seconds = 10
# Any format-level setting can also be set here, on the item itself --
# shared across all of this item's formats instead of repeated on each one
# (see README.md "Setting resolution"). Both formats below inherit this
# before_text; neither needs to repeat it.
before_text = "Sample Event"

[[items.formats]]
type = "days"
precision = 2
after_text = "days away"
background = "#001030"
value_color = "#ffcc00"
# Long-press BOOT to try this out -- the onboard LED loops through these
# colors while this format is active (see README.md "LED light show").
led_colors = ["#ff0000", "#ffcc00", "#0000ff"]
led_cycle_seconds = 3

[[items.formats]]
type = "dhms"
# No before_text/after_text here -- before_text is inherited from the item
# above, and after_text falls all the way through to its "" hardcoded
# default (no item/defaults value set either), same net effect as this
# format explicitly setting after_text = "" itself.

[[items]]
target = "2027-01-01T00:00:00Z"
display_seconds = 8

[[items.formats]]
type = "days"
precision = 1
before_text = "New Year"
after_text = ""
